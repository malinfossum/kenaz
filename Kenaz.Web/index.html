<!doctype html>
<html lang="en" data-palette="kenaz">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Kenaz — your private daily wellbeing check-in." />
		<title>Kenaz</title>

		<!-- PWA: installable standalone app (relative hrefs work under any base path) -->
		<link rel="manifest" href="manifest.webmanifest" />
		<meta name="theme-color" content="#000000" />
		<link rel="icon" href="icons/favicon.ico" sizes="any" />
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />

		<!-- Social preview. og:image and og:url must be absolute: crawlers do not
		     reliably resolve relative paths and report them as unreachable. -->
		<meta property="og:title" content="Kenaz — a private, offline daily wellbeing check-in" />
		<meta
			property="og:description"
			content="Log mood, energy and sleep, and see your patterns over time. Everything stays on your device — no account, no server, works offline."
		/>
		<meta property="og:image" content="https://malinfossum.github.io/kenaz/og.png" />
		<meta property="og:url" content="https://malinfossum.github.io/kenaz/" />
		<meta property="og:type" content="website" />

		<!-- No-flash theme init: must run BEFORE stylesheets -->
		<script>
			(function () {
				var saved = localStorage.getItem("theme")
				document.documentElement.dataset.theme = saved || "dark"
			})()
		</script>

		<!-- Design system foundation (served from public/design-system) -->
		<link rel="stylesheet" href="/design-system/tokens/index.css" />
		<link rel="stylesheet" href="/design-system/base/reset.css" />
		<link rel="stylesheet" href="/design-system/base/base.css" />
		<link rel="stylesheet" href="/design-system/primitives/index.css" />
		<link rel="stylesheet" href="/design-system/components/index.css" />
		<link rel="stylesheet" href="/design-system/compositions/index.css" />
		<link rel="stylesheet" href="/design-system/utilities/index.css" />
	</head>
	<body>
		<a class="skip-link" href="#main">Skip to content</a>

		<!-- The View renders the whole app (header, screen, bottom tabs) into #main -->
		<main id="main"></main>

		<!-- Visually-hidden live region for save/delete confirmations (persists across re-renders) -->
		<div id="sr-status" class="sr-only" aria-live="polite"></div>

		<!-- Vite entry point -->
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
