name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this job only reads the tree to run dotnet test. Without an
# explicit block the GITHUB_TOKEN gets the repo default, which is far wider than
# any step here needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Kenaz.slnx
